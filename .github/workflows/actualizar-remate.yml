name: Actualizar remate FERCOGAN

on:
  schedule:
    # 09:00 hora Bolivia (UTC-4) = 13:00 UTC, todos los dias
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Revisar canal y actualizar el portal si hay remate nuevo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/check_and_update.py

      - name: Publicar cambios (si los hay)
        run: |
          git config user.name "portal-ganadero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Sin cambios, no se publica nada." || (
            git commit -m "Actualiza remate ($(date -u +%F))"
            git push
          )
