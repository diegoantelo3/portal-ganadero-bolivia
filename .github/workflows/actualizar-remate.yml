# DESACTIVADO — no funciona desde los servidores de GitHub.
#
# YouTube le entrega a las IPs de servidores en la nube (GitHub, AWS, Google
# Cloud) una version recortada del video, sin ningun formato reproducible:
# solo miniaturas. Eso pasa con cookies y con cualquier cliente forzado, asi
# que no hay arreglo posible desde el codigo. Comprobado el 31/07/2026.
#
# La actualizacion corre en la PC de Cindy con el Programador de tareas de
# Windows (ver ACTUALIZAR-PORTAL.bat y README.md), donde YouTube si entrega
# el video completo.
#
# Se deja el workflow por si algun dia se contrata un proxy residencial: en
# ese caso, descomentar el bloque "schedule" y agregar el proxy al motor.

name: Actualizar remate FERCOGAN (desactivado)

on:
  # schedule:
  #   - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar cookies de YouTube
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt escrito: $(wc -l < cookies.txt) lineas."
          else
            echo "No hay secreto YOUTUBE_COOKIES cargado."
          fi

      - name: Revisar canal y actualizar el portal si hay remate nuevo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/check_and_update.py

      - name: Publicar cambios (si los hay)
        run: |
          rm -f cookies.txt
          git config user.name "portal-ganadero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Sin cambios, no se publica nada." || (
            git commit -m "Actualiza remate ($(date -u +%F))"
            git push
          )
