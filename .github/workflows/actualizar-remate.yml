name: Actualizar remate FERCOGAN

on:
  schedule:
    # 09:00 hora Bolivia (UTC-4) = 13:00 UTC, todos los dias
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar cookies de YouTube (evita el bloqueo a servidores en la nube)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt listo."
          else
            echo "No hay secreto YOUTUBE_COOKIES cargado; se sigue sin cookies (puede fallar por bloqueo de YouTube)."
          fi

      - name: Revisar canal y actualizar el portal si hay remate nuevo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/check_and_update.py

      - name: Publicar cambios (si los hay)
        run: |
          rm -f cookies.txt
          git config user.name "portal-ganadero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Sin cambios, no se publica nada." || (
            git commit -m "Actualiza remate ($(date -u +%F))"
            git push
          )
