name: Actualizar remate FERCOGAN

on:
  schedule:
    # 09:00 hora Bolivia (UTC-4) = 13:00 UTC, todos los dias
    - cron: "0 13 * * *"
  workflow_dispatch: {}

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Preparar cookies de YouTube (evita el bloqueo a servidores en la nube)
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          if [ -n "$YOUTUBE_COOKIES" ]; then
            printf '%s' "$YOUTUBE_COOKIES" > cookies.txt
            echo "cookies.txt escrito: $(wc -l < cookies.txt) lineas, $(wc -c < cookies.txt) bytes."
            if head -n1 cookies.txt | grep -qE '^# (Netscape|HTTP) Cookie File'; then
              echo "Encabezado: OK (formato Netscape reconocido)"
            else
              echo "Encabezado: NO coincide con '# Netscape HTTP Cookie File' ni '# HTTP Cookie File'"
            fi
            echo "Lineas con dominio youtube.com: $(grep -c 'youtube\.com' cookies.txt || true)"
            echo "Lineas con dominio google.com: $(grep -c 'google\.com' cookies.txt || true)"
            echo "Lineas con retorno de carro (CRLF, no deberia haber): $(grep -c $'\r' cookies.txt || true)"
            echo "Cookies clave presentes: SID=$(grep -c $'\tSID\t' cookies.txt || true) SAPISID=$(grep -c $'\tSAPISID\t' cookies.txt || true) LOGIN_INFO=$(grep -c $'\tLOGIN_INFO\t' cookies.txt || true)"
          else
            echo "No hay secreto YOUTUBE_COOKIES cargado; se sigue sin cookies (puede fallar por bloqueo de YouTube)."
          fi

      - name: Debug - probar yt-dlp directo contra el video de hoy
        run: |
          echo "--- con cookies + android_vr ---"
          python -m yt_dlp --no-warnings --cookies cookies.txt --extractor-args "youtube:player_client=android_vr" --list-formats "https://www.youtube.com/watch?v=haEa9Z6LQFA" || true
          echo "--- con cookies, cliente por defecto (sin forzar) ---"
          python -m yt_dlp --no-warnings --cookies cookies.txt --list-formats "https://www.youtube.com/watch?v=haEa9Z6LQFA" || true
        continue-on-error: true

      - name: Revisar canal y actualizar el portal si hay remate nuevo
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python automation/check_and_update.py

      - name: Publicar cambios (si los hay)
        run: |
          rm -f cookies.txt
          git config user.name "portal-ganadero-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Sin cambios, no se publica nada." || (
            git commit -m "Actualiza remate ($(date -u +%F))"
            git push
          )
